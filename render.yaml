databases:
  - name: mothercare-db
    databaseName: mothercare
    user: mothercare_user
    plan: free
    region: oregon

services:
  - type: web
    name: mothercare-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mothercare-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: STORAGE_BACKEND
        value: "local"
